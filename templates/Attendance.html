<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/attendance.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <h1><i class="fas fa-calendar-check"></i> Attendance Management</h1>

        <a href="/dashboard" class="back-btn">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>

    </div>

    <!-- Date & Time -->

    <div class="top-info">

        <div class="info-box">

            <i class="fas fa-calendar"></i>

            <span id="date"></span>

        </div>

        <div class="info-box">

            <i class="fas fa-clock"></i>

            <span id="clock"></span>

        </div>

    </div>

    <!-- Attendance Form -->

    <form method="POST">

        <div class="card">

            <h2><i class="fas fa-user-check"></i> Mark Attendance</h2>

            <div class="grid">

                <div class="input-box">

                    <label>Employee ID</label>

                    <input type="text"
                           name="employee_id"
                           placeholder="EMP001"
                           required>

                </div>

                <div class="input-box">

                    <label>Employee Name</label>

                    <input type="text"
                           name="employee_name"
                           placeholder="Employee Name"
                           required>

                </div>

                <div class="input-box">

                    <label>Department</label>

                    <select name="department">

                        <option>HR</option>
                        <option>IT</option>
                        <option>Finance</option>
                        <option>Marketing</option>
                        <option>Sales</option>
                        <option>Production</option>

                    </select>

                </div>

                <div class="input-box">

                    <label>Status</label>

                    <select name="status">

                        <option>Present</option>
                        <option>Absent</option>
                        <option>Half Day</option>
                        <option>Leave</option>

                    </select>

                </div>

                <div class="input-box">

                    <label>Check In</label>

                    <input type="time"
                           name="checkin">

                </div>

                <div class="input-box">

                    <label>Check Out</label>

                    <input type="time"
                           name="checkout">

                </div>

                <div class="input-box full">

                    <label>Remarks</label>

                    <textarea name="remarks"
                              rows="3"
                              placeholder="Enter remarks..."></textarea>

                </div>

            </div>

        </div>

        <!-- Camera -->

        <div class="card">

            <h2><i class="fas fa-camera"></i> Camera Attendance (Optional)</h2>

            <div class="camera-box">

                <i class="fas fa-camera-retro"></i>

                <p>Camera integration will be added in the next phase.</p>

                <button type="button" class="camera-btn">

                    <i class="fas fa-video"></i>

                    Open Camera

                </button>

            </div>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button class="save" type="submit">

                <i class="fas fa-save"></i>

                Save Attendance

            </button>

            <button class="reset" type="reset">

                <i class="fas fa-rotate"></i>

                Reset

            </button>

        </div>

    </form>

    <!-- Attendance Table -->

    <div class="card">

        <h2><i class="fas fa-table"></i> Today's Attendance</h2>

        <table>

            <thead>

            <tr>

                <th>Employee ID</th>

                <th>Name</th>

                <th>Status</th>

                <th>Check In</th>

                <th>Check Out</th>

            </tr>

            </thead>

            <tbody>

            <tr>

                <td colspan="5" style="text-align:center;">

                    No Attendance Records

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

function updateClock(){

let now=new Date();

document.getElementById("clock").innerHTML=now.toLocaleTimeString();

document.getElementById("date").innerHTML=now.toLocaleDateString();

}

setInterval(updateClock,1000);

updateClock();

</script>

</body>

</html>
