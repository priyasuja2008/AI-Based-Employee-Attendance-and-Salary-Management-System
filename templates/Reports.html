<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Reports</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/reports.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="header">

<h1>
<i class="fas fa-chart-bar"></i>
Attendance Reports
</h1>

<a href="/dashboard" class="back-btn">
<i class="fas fa-arrow-left"></i>
Dashboard
</a>

</div>

<div class="cards">

<div class="card">
<i class="fas fa-calendar-day"></i>
<h3>Daily Report</h3>
<p>View today's attendance.</p>
<button>Open</button>
</div>

<div class="card">
<i class="fas fa-calendar-week"></i>
<h3>Weekly Report</h3>
<p>Attendance of this week.</p>
<button>Open</button>
</div>

<div class="card">
<i class="fas fa-calendar-alt"></i>
<h3>Monthly Report</h3>
<p>Attendance of this month.</p>
<button>Open</button>
</div>

<div class="card">
<i class="fas fa-user-check"></i>
<h3>Employee Report</h3>
<p>Individual employee attendance.</p>
<button>Open</button>
</div>

</div>

<div class="download">

<button class="pdf">
<i class="fas fa-file-pdf"></i>
Download PDF
</button>

<button class="excel">
<i class="fas fa-file-excel"></i>
Download Excel
</button>

<button class="print">
<i class="fas fa-print"></i>
Print Report
</button>

</div>

</div>

</body>

</html>
