<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salary Management</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/salary.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="header">

<h1>
<i class="fas fa-money-check-dollar"></i>
Salary Management
</h1>

<a href="/dashboard" class="back-btn">
<i class="fas fa-arrow-left"></i>
Dashboard
</a>

</div>

<form>

<div class="card">

<h2>Employee Salary Details</h2>

<div class="grid">

<div class="input-box">
<label>Employee Code</label>
<input type="text" placeholder="EMP001">
</div>

<div class="input-box">
<label>Employee Name</label>
<input type="text" placeholder="Employee Name">
</div>

<div class="input-box">
<label>Basic Salary</label>
<input type="number" id="basic" value="25000">
</div>

<div class="input-box">
<label>Present Days</label>
<input type="number" id="present" value="26">
</div>

<div class="input-box">
<label>Absent Days</label>
<input type="number" id="absent" value="4">
</div>

<div class="input-box">
<label>Bonus</label>
<input type="number" id="bonus" value="1000">
</div>

<div class="input-box">
<label>Deductions</label>
<input type="number" id="deduction" value="500">
</div>

<div class="input-box">
<label>Net Salary</label>
<input type="text" id="netsalary" readonly>
</div>

</div>

<div class="buttons">

<button type="button" onclick="calculateSalary()">
<i class="fas fa-calculator"></i>
Calculate
</button>

<button type="button">
<i class="fas fa-print"></i>
Print Slip
</button>

<button type="button">
<i class="fas fa-file-pdf"></i>
Download PDF
</button>

</div>

</div>

</form>

</div>

<script>

function calculateSalary(){

let basic=parseFloat(document.getElementById("basic").value);

let bonus=parseFloat(document.getElementById("bonus").value);

let deduction=parseFloat(document.getElementById("deduction").value);

let salary=(basic+bonus)-deduction;

document.getElementById("netsalary").value=salary;

}

calculateSalary();

</script>

</body>

</html>
